<!-- Layout: Auth wrapper -->
<div class="auth-wrapper">
  <main class="py-10 flex-1" style="display:flex; align-items:center; justify-content:center;">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-2 gap-10 items-center">
      <div class="lg:col-span-1">
        <div class="rounded-2xl p-6 ">
          <div class="flex items-center justify-end gap-2 text-sm text-slate-600">
            <a href="#"
              class="hover:text-primary-blue">العربية</a>
            <span class="text-slate-400">/</span>
            <a href="#"
              class="hover:text-primary-blue">English</a>
          </div>
          <h2 class="text-xl font-bold">Auth Register Title</h2>
            <div class="mt-3 rounded-lg bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-700">
            </div>
            <div class="mt-3 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
              <ul class="list-disc list-inside space-y-1">
                 <li>Placeholder</li>
              </ul>
            </div>
          <form class="mt-4 space-y-4" action="#" method="POST">
            <div>
              <label class="block text-sm font-medium text-slate-700">Auth Register Name</label>
              <input name="name" value=""
                style="border: 1px solid #2e3192;" type="text"
                placeholder="Jane Doe"
                class="mt-1 w-full rounded-lg border px-3 py-2 focus:ring-primary-blue focus:border-primary-blue"
                required />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700">Auth Register Email</label>
              <input name="email" value=""
                style="border: 1px solid #2e3192;" type="email"
                placeholder="you@example.com"
                class="mt-1 w-full rounded-lg border px-3 py-2 focus:ring-primary-blue focus:border-primary-blue"
                required />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700">Auth Register Password</label>
              <input name="password" style="border: 1px solid #2e3192;"
                type="password" placeholder="••••••••"
                class="mt-1 w-full rounded-lg border px-3 py-2 focus:ring-primary-blue focus:border-primary-blue"
                required />
              <p class="mt-1 text-xs text-slate-500">Auth Register Password Hint</p>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700">Auth Register Password Confirm</label>
              <input name="password_confirmation"
                style="border: 1px solid #2e3192;"
                type="password" placeholder="••••••••"
                class="mt-1 w-full rounded-lg border px-3 py-2 focus:ring-primary-blue focus:border-primary-blue"
                required />
            </div>
            <!-- Level selection toggle -->
            <div>
              <div class="level-toggle mb-2 flex justify-center">
                <label class="option"><input type="radio" name="level" value="fresh" > حديث التخرج</label>
                <label class="option"><input type="radio" name="level" value="mid" > متوسط الخبرة</label>
                <label class="option"><input type="radio" name="level" value="consultant" > استشاري</label>
              </div>
            </div>
            <!-- Agreement and submit on the same line -->
            <div class="flex items-center justify-between gap-3">
              <label class="inline-flex items-center gap-2 text-sm"><input type="checkbox"
                  class="rounded border-slate-300" required> Auth Register Agree Prefix <a href="#"
                  class="text-cyan-accent">Auth Register Terms</a></label>
              <button type="submit"
                class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-primary-blue text-white font-semibold hover:opacity-90"
                style="background-color: #2e3192;">Auth Register Submit</button>
            </div>
          </form>
        </div>
      </div>
      <div class="lg:block">
        <img src="assets/logo.svg" alt="EradcHub" width="300" class="block mx-auto lg:mx-0">
        <div class="flex gap-4 mt-2 items-center">
          <h1 class="text-xl font-extrabold w-50 text-secondary-blue flex-1" style="width: 300px;">
            Auth Register Hero Line1
            Auth Register Hero Line2
          </h1>
          <!-- Vertical divider on desktop -->
          <div class="hidden md:block w-px bg-slate-200 self-stretch"></div>
          <div class="flex-1">
            <span>Auth Register Have Account Title</span>
            <br />
            <a href="#"
              class="bg-primary-blue text-white px-4 py-2 mt-2 block text-center rounded-lg"
              style="background-color: #2e3192;">Auth Register Sign In <i
                class="fi fi-rr-arrow-right"></i></a>
          </div>
        </div>
        <!-- Horizontal divider on mobile -->
        <hr class="md:hidden border-slate-200 my-4" />
      </div>
    </div>
  </main>
</div>
<!-- /Layout: Auth wrapper -->
