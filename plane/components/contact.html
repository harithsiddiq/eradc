<!-- Contact Us -->
<section id="contact" class="py-12 sm:py-16 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid sm:grid-cols-2 gap-8 items-start">
      <div class="text-right">
        <h3 class="text-2xl sm:text-3xl font-extrabولد tracking-tight text-primary-blue mb-6">
        </h3>
        <p class="mt-2 text-gray-600 text-sm">
        </p>
        <div class="mt-6 space-y-3 text-sm text-gray-700">
          <div class="flex items-center gap-3 justify-end">
            <span>Placeholder</span>
          </div>
          <div class="flex items-center gap-3 justify-end"><a href="mailto:Footer data"
              class="hover:text-cyan-accent">Footer data</a><i
              class="fi fi-rr-envelope w-5 h-5 text-gray-500"></i></div>
          <div class="flex items-center gap-3 justify-end">
            <span>Placeholder</span><i
              class="fi fi-rr-folder w-5 h-5 text-gray-500"></i></div>
        </div>
      </div>
      <form class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card" action="#" method="post">
        <div class="grid gap-4">
          <div><label for="name"
              class="block text-sm font-medium text-gray-700">Contact Name Label</label><input id="name"
              name="name" type="text" required
              class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-600"
              placeholder="Contact Name" /></div>
          <div><label for="email"
              class="block text-sm font-medium text-gray-700">Contact Email Label</label><input id="email"
              name="email" type="email" required
              class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-600"
              placeholder="Contact Email" /></div>
          <div><label for="message"
              class="block text-sm font-medium text-gray-700">Contact Message Label</label><textarea
              id="message" name="message" rows="4" required
              class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-600"
              placeholder="Contact Message"></textarea></div>
        </div>
        <div class="mt-4 flex items-center justify-between">
          <a href="tel:Footer data"
            class="inline-flex items-center px-4 py-2 rounded-xl border border-slate-300 text-gray-900 font-semibold hover:bg-slate-50">Placeholder</a>
          <button type="submit"
            class="inline-flex items-center px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold shadow-glow hover:bg-brand-700"><i
              class="fi fi-rr-arrow-left mr-2 w-4 h-4"></i>Contact Send Message</button>
        </div>
      </form>
    </div>
  </div>
</section>
